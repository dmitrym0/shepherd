[package]
name = "shepherd"
version = "0.2.1"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Terminal-independent AI agent supervision: run agents in your terminal, monitor their status anywhere"

[[bin]]
name = "shep"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
portable-pty = "0.9"
vt100 = "0.15"
libc = "0.2"
signal-hook = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
